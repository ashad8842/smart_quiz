name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name smart_quiz
      - name: Add internet permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=ANTHROPIC_KEY=${{ secrets.ANTHROPIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: smart-quiz-apk
          path: build/app/outputs/flutter-apk/app-release.apk